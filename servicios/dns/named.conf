// SRV-DMZ — bind9 autoritativo de g5.eif101o.test (IPv4 e IPv6)
// Fuente del diseño: sección Servicio DNS/HTTP de docs/especificacion.md.
// Ruta en el servidor: /etc/bind/named.conf

// Clientes que reciben la vista interna. La negación va primero: la WAN pública
// sale del mismo /48 pero está afuera del firewall, así que recibe la vista externa.
acl "red-interna" {
    !2001:db8:105:ff01::/64;
    10.50.0.0/16;
    2001:db8:105::/48;
    127.0.0.1;
    ::1;
};

options {
    directory "/var/bind";
    pid-file "/var/run/named/named.pid";

    // Escucha en todas sus direcciones: 10.50.1.34 y 2001:db8:105:30::10 en la DMZ.
    // Con "any" no importa si eth0 termina de configurarse después de que arranca bind.
    listen-on { any; };
    listen-on-v6 { any; };

    // Solo autoritativo: no es un resolver abierto hacia Internet.
    recursion no;
    allow-query { any; };
    allow-transfer { none; };
    dnssec-validation no;
    version "no disponible";
};

// Registro de consultas: muestra el cliente y la vista que respondió (evidencia de P01-P04 y E06).
logging {
    channel consultas {
        file "/var/log/named/consultas.log" versions 3 size 5m;
        print-time yes;
        severity info;
    };
    category queries { consultas; };
};

view "interna" {
    match-clients { red-interna; };
    zone "g5.eif101o.test" {
        type primary;
        file "/etc/bind/zonas/db.g5.eif101o.test.interna";
    };
};

view "externa" {
    match-clients { any; };
    zone "g5.eif101o.test" {
        type primary;
        file "/etc/bind/zonas/db.g5.eif101o.test.externa";
    };
};
