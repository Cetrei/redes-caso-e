# SRV-DMZ — nginx para www, v4 y v6.g5.eif101o.test (IPv4 e IPv6)
# Ruta en el servidor: /etc/nginx/http.d/default.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name www.g5.eif101o.test v4.g5.eif101o.test v6.g5.eif101o.test;

    root /var/www/caso-e;
    index index.html;

    # SSI: la página muestra el nombre pedido, la IP del cliente y la familia (evidencia de P05 y P06).
    ssi on;

    access_log /var/log/nginx/caso-e.access.log;
    error_log  /var/log/nginx/caso-e.error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }
}
