config system global
    set hostname "FGT-01"
    set admintimeout 30
end

config system admin
    edit "admin"
        set trusthost1 10.50.1.0 255.255.255.224
        set ip6-trusthost1 2001:db8:105:20::/64
    next
end

config system interface
    edit "port1"
        set alias "WAN"
        set role wan
        set mode static
        set ip 203.0.113.18 255.255.255.248
        set allowaccess ping
        config ipv6
            set ip6-address 2001:db8:105:ff01::2/64
            set ip6-allowaccess ping
        end
    next
    edit "port2"
        set alias "LAN"
        set role lan
        set mode static
        set ip 10.50.1.49 255.255.255.252
        set allowaccess ping https ssh
        config ipv6
            set ip6-address 2001:db8:105:ff00::1/64
            set ip6-allowaccess ping https ssh
        end
    next
    edit "port3"
        set alias "DMZ"
        set role dmz
        set mode static
        set ip 10.50.1.33 255.255.255.240
        set allowaccess ping
        config ipv6
            set ip6-address 2001:db8:105:30::1/64
            set ip6-allowaccess ping
        end
    next
end

config router static
    edit 1
        set gateway 203.0.113.17
        set device "port1"
    next
    edit 2
        set dst 10.50.0.0 255.255.0.0
        set blackhole enable
        set distance 254
    next
end

config router static6
    edit 1
        set gateway 2001:db8:105:ff01::1
        set device "port1"
    next
    edit 2
        set dst 2001:db8:105::/48
        set blackhole enable
        set distance 254
    next
end

config router ospf
    set router-id 5.5.5.1
    set default-information-originate enable
    config area
        edit 0.0.0.0
        next
    end
    config network
        edit 1
            set prefix 10.50.1.48 255.255.255.252
            set area 0.0.0.0
        next
        edit 2
            set prefix 10.50.1.32 255.255.255.240
            set area 0.0.0.0
        next
    end
    set passive-interface "port3"
end

config router ospf6
    set router-id 5.5.5.1
    set default-information-originate enable
    config area
        edit 0.0.0.0
        next
    end
    config ospf6-interface
        edit "port2"
            set interface "port2"
            set area-id 0.0.0.0
        next
        edit "port3"
            set interface "port3"
            set area-id 0.0.0.0
        next
    end
    set passive-interface "port3"
end

config firewall address
    edit "NET-USUARIOS-v4"
        set subnet 10.50.0.0 255.255.255.0
    next
    edit "NET-ADMIN-v4"
        set subnet 10.50.1.0 255.255.255.224
    next
    edit "SRV-DMZ-v4"
        set subnet 10.50.1.34 255.255.255.255
    next
end

config firewall address6
    edit "NET-USUARIOS-v6"
        set ip6 2001:db8:105:10::/64
    next
    edit "NET-ADMIN-v6"
        set ip6 2001:db8:105:20::/64
    next
    edit "SRV-DMZ-v6"
        set ip6 2001:db8:105:30::10/128
    next
end

config firewall addrgrp
    edit "NET-LAN-v4"
        set member "NET-USUARIOS-v4" "NET-ADMIN-v4"
    next
end

config firewall addrgrp6
    edit "NET-LAN-v6"
        set member "NET-USUARIOS-v6" "NET-ADMIN-v6"
    next
end

config firewall vip
    edit "VIP-SRV-DMZ"
        set extip 203.0.113.20
        set mappedip "10.50.1.34"
        set extintf "port1"
    next
end

config firewall service custom
    edit "ECO-ICMPV6"
        set protocol ICMP6
        set icmptype 128
    next
end

config firewall policy
    edit 1
        set name "DNS-HTTP-A-DMZ"
        set srcintf "port1" "port2"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "VIP-SRV-DMZ" "SRV-DMZ-v4"
        set srcaddr6 "all"
        set dstaddr6 "SRV-DMZ-v6"
        set action accept
        set schedule "always"
        set service "DNS" "HTTP"
        set logtraffic all
        set comments "Plan B: une PUB-DNS-HTTP y USUARIOS-A-DMZ. Sin SNAT: el servidor ve el origen real"
    next
    edit 2
        set name "ADMIN-A-DMZ"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "NET-ADMIN-v4"
        set dstaddr "SRV-DMZ-v4"
        set srcaddr6 "NET-ADMIN-v6"
        set dstaddr6 "SRV-DMZ-v6"
        set action accept
        set schedule "always"
        set service "SSH" "DNS" "HTTP" "PING" "ECO-ICMPV6"
        set logtraffic all
        set comments "Unica zona autorizada para administrar el servidor"
    next
    edit 3
        set name "DENY-A-LAN"
        set srcintf "port1" "port3"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set srcaddr6 "all"
        set dstaddr6 "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "La LAN no queda expuesta desde la WAN ni desde la DMZ (requisito central)"
    next
end

config log setting
    set fwpolicy-implicit-log enable
    set fwpolicy6-implicit-log enable
    set local-in-deny-unicast enable
end

config log disk setting
    set status enable
end

config log syslogd setting
    set status enable
    set server "10.50.1.10"
    set mode udp
    set port 514
end
