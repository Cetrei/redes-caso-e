# FGT-01 — FortiGate: interfaces/zonas, VIP, políticas, OSPF, blackholes, logs y syslog
# Fuente del diseño: docs/especificacion.md. Sintaxis: FortiOS 7.2 / 7.4 (CLI).
# Se pega por la consola de GNS3, bloque por bloque. En FortiOS el carácter # no es comentario:
# copiá solo las líneas de comandos, no las que empiezan con #.
#
# Antes de pegar, confirmá la versión con "get system status".
#  - FortiOS 6.4: las políticas IPv4+IPv6 juntas requieren
#      config system settings / set consolidated-firewall-mode enable
#    o duplicar el bloque de políticas en "config firewall policy6".
#  - Licencia de prueba (3 interfaces, 3 políticas, 3 rutas): usar el PLAN B del final.

# === 1. Base ===
config system global
    set hostname "FGT-01"
    set admintimeout 30
end

# La contraseña de admin ("admin") se pone en el aviso de la primera entrada, no acá:
# cambiar la contraseña de la cuenta con la que estás conectado pide la anterior y corta el pegado.
#
# Solo la VLAN 20 administra el FortiGate (prueba E13).
# Repetir en TODAS las cuentas admin; con una sola cuenta sin trusted hosts, el FGT responde a cualquiera.
# La consola de GNS3 no se ve afectada, así que no hay riesgo de quedarse afuera.
config system admin
    edit "admin"
        set trusthost1 10.50.1.0 255.255.255.224
        set ip6-trusthost1 2001:db8:105:20::/64
    next
end

# === 2. Interfaces ===
config system interface
    edit "port1"
        set alias "WAN"
        set role wan
        set mode static
        set ip 203.0.113.18 255.255.255.248
        set allowaccess ping
        config ipv6
            set ip6-address 2001:db8:105:ff01::2/64
            set ip6-allowaccess ping
        end
    next
    edit "port2"
        set alias "LAN"
        set role lan
        set mode static
        set ip 10.50.1.49 255.255.255.252
        set allowaccess ping https ssh
        config ipv6
            set ip6-address 2001:db8:105:ff00::1/64
            set ip6-allowaccess ping https ssh
        end
    next
    edit "port3"
        set alias "DMZ"
        set role dmz
        set mode static
        set ip 10.50.1.33 255.255.255.240
        set allowaccess ping
        config ipv6
            set ip6-address 2001:db8:105:30::1/64
            set ip6-allowaccess ping
        end
    next
end

# === 3. Enrutamiento ===
# Estáticas: salida a Internet y blackholes para destinos internos inexistentes (prueba E15).
config router static
    edit 1
        set gateway 203.0.113.17
        set device "port1"
    next
    edit 2
        set dst 10.50.0.0 255.255.0.0
        set blackhole enable
        set distance 254
    next
end

config router static6
    edit 1
        set gateway 2001:db8:105:ff01::1
        set device "port1"
    next
    edit 2
        set dst 2001:db8:105::/48
        set blackhole enable
        set distance 254
    next
end

# OSPFv2: vecino R-LAN por port2, DMZ anunciada como pasiva, ruta por defecto inyectada.
config router ospf
    set router-id 5.5.5.1
    set default-information-originate enable
    config area
        edit 0.0.0.0
        next
    end
    config network
        edit 1
            set prefix 10.50.1.48 255.255.255.252
            set area 0.0.0.0
        next
        edit 2
            set prefix 10.50.1.32 255.255.255.240
            set area 0.0.0.0
        next
    end
    set passive-interface "port3"
end

# OSPFv3. Si "default-information-originate" no existe en esta versión, se omite
# y se usa la estática ::/0 comentada en configs/R-LAN.txt.
config router ospf6
    set router-id 5.5.5.1
    set default-information-originate enable
    config area
        edit 0.0.0.0
        next
    end
    config ospf6-interface
        edit "port2"
            set interface "port2"
            set area-id 0.0.0.0
        next
        edit "port3"
            set interface "port3"
            set area-id 0.0.0.0
        next
    end
    set passive-interface "port3"
end

# === 4. Seguridad ===
# Objetos de dirección
config firewall address
    edit "NET-USUARIOS-v4"
        set subnet 10.50.0.0 255.255.255.0
    next
    edit "NET-ADMIN-v4"
        set subnet 10.50.1.0 255.255.255.224
    next
    edit "SRV-DMZ-v4"
        set subnet 10.50.1.34 255.255.255.255
    next
end

config firewall address6
    edit "NET-USUARIOS-v6"
        set ip6 2001:db8:105:10::/64
    next
    edit "NET-ADMIN-v6"
        set ip6 2001:db8:105:20::/64
    next
    edit "SRV-DMZ-v6"
        set ip6 2001:db8:105:30::10/128
    next
end

config firewall addrgrp
    edit "NET-LAN-v4"
        set member "NET-USUARIOS-v4" "NET-ADMIN-v4"
    next
end

config firewall addrgrp6
    edit "NET-LAN-v6"
        set member "NET-USUARIOS-v6" "NET-ADMIN-v6"
    next
end

# VIP 1:1: publica el servidor en IPv4. En IPv6 no hay NAT66.
config firewall vip
    edit "VIP-SRV-DMZ"
        set extip 203.0.113.20
        set mappedip "10.50.1.34"
        set extintf "port1"
    next
end

# El servicio predefinido PING es solo ICMPv4; este agrega el eco de ICMPv6.
config firewall service custom
    edit "ECO-ICMPV6"
        set protocol ICMP6
        set icmptype 128
    next
end

# Políticas, en orden de evaluación. Cada una cubre IPv4 (srcaddr/dstaddr) e IPv6 (srcaddr6/dstaddr6).
config firewall policy
    edit 1
        set name "PUB-DNS-HTTP"
        set srcintf "port1"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "VIP-SRV-DMZ"
        set srcaddr6 "all"
        set dstaddr6 "SRV-DMZ-v6"
        set action accept
        set schedule "always"
        set service "DNS" "HTTP"
        set logtraffic all
        set comments "Publicacion controlada hacia la red externa. Sin SNAT: el servidor ve el origen real"
    next
    edit 2
        set name "ADMIN-A-DMZ"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "NET-ADMIN-v4"
        set dstaddr "SRV-DMZ-v4"
        set srcaddr6 "NET-ADMIN-v6"
        set dstaddr6 "SRV-DMZ-v6"
        set action accept
        set schedule "always"
        set service "SSH" "DNS" "HTTP" "PING" "ECO-ICMPV6"
        set logtraffic all
        set comments "Unica zona autorizada para administrar el servidor"
    next
    edit 3
        set name "USUARIOS-A-DMZ"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "NET-USUARIOS-v4"
        set dstaddr "SRV-DMZ-v4"
        set srcaddr6 "NET-USUARIOS-v6"
        set dstaddr6 "SRV-DMZ-v6"
        set action accept
        set schedule "always"
        set service "DNS" "HTTP"
        set logtraffic all
        set comments "Consumo interno del servicio, sin gestion"
    next
    edit 4
        set name "LAN-A-INTERNET"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "NET-LAN-v4"
        set dstaddr "all"
        set srcaddr6 "NET-LAN-v6"
        set dstaddr6 "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS" "PING" "ECO-ICMPV6"
        set nat enable
        set logtraffic utm
        set comments "Salida a Internet. SNAT a 203.0.113.18 solo en IPv4"
    next
    edit 5
        set name "DENY-EXT-A-LAN"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set srcaddr6 "all"
        set dstaddr6 "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "La LAN no queda expuesta (requisito central)"
    next
    edit 6
        set name "DENY-DMZ-A-LAN"
        set srcintf "port3"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set srcaddr6 "all"
        set dstaddr6 "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "Un servidor comprometido no puede saltar a la LAN"
    next
end

# Logs: denegación implícita, accesos administrativos denegados (local-in), disco y syslog.
config log setting
    set fwpolicy-implicit-log enable
    set fwpolicy6-implicit-log enable
    set local-in-deny-unicast enable
end

# Requiere el disco de logs de la plantilla de GNS3 conectado.
config log disk setting
    set status enable
end

config log syslogd setting
    set status enable
    set server "10.50.1.10"
    set mode udp
    set port 514
end

