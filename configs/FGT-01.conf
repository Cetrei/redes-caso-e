# ------------------------------------------------------------------
# Verificación
# ------------------------------------------------------------------
#   get system status                              versión y licencia
#   get router info routing-table all              (R02)
#   get router info6 routing-table
#   get router info ospf neighbor                  (R01)
#   get router info6 ospf neighbor
#   diagnose sys session list                      sesiones durante las pruebas
#   execute log filter category 0                  tráfico de reenvío
#   execute log filter field policyid 5            (E01: filtrar por política)
#   execute log display
# F01: config firewall policy / edit 1 / set status disable / end   (y luego enable)
